<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grana+ | Seu copiloto financeiro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08120E;
  --card:#111B16;
  --green:#1E6B4B;
  --green-light:#38C172;
  --text:#fff;
  --sub:#A7B3AD;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
  position:relative;
}

.hero h1{
  font-size:56px;
}

.hero p{
  margin-top:20px;
  color:var(--sub);
}

.cta{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:15px;
}

button{
  padding:14px 28px;
  border-radius:12px;
  border:none;
  cursor:pointer;
}

.primary{
  background:linear-gradient(135deg,var(--green),var(--green-light));
  color:#fff;
}

.secondary{
  background:transparent;
  border:1px solid #333;
  color:#fff;
}

/* MOCKUP PRINCIPAL */
.mockup-wrap{
  position:relative;
  margin-top:80px;
  display:flex;
  justify-content:center;
  perspective:1200px;
}

.mockup-real{
  width:900px;
  max-width:95%;
  transition:.1s;
}

.mockup-real img{
  width:100%;
  border-radius:20px;
  box-shadow:0 60px 140px rgba(0,0,0,0.8);
}

/* IPHONE FLOAT */
.iphone-float-wrap{
  position:absolute;
  right:8%;
  bottom:-60px;
  width:260px;
}

.iphone{
  width:100%;
  animation:float 6s ease-in-out infinite;
  transition:.2s;
}

.iphone img{
  width:100%;
  border-radius:30px;
  box-shadow:0 40px 100px rgba(0,0,0,0.7);
}

@keyframes float{
  0%{transform:translateY(0px) rotate(-2deg);}
  50%{transform:translateY(-20px) rotate(2deg);}
  100%{transform:translateY(0px) rotate(-2deg);}
}

/* GLOW */
.glow{
  position:absolute;
  width:300px;
  height:300px;
  background:radial-gradient(circle, rgba(56,193,114,0.25), transparent 70%);
  filter:blur(60px);
}

/* SECTIONS */
.section{
  padding:120px 20px;
  text-align:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:40px;
}

.card{
  background:var(--card);
  padding:30px;
  border-radius:16px;
}

/* REVEAL */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:.8s;
}

.reveal.visible{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE */
@media(max-width:768px){
  .hero h1{font-size:34px;}
  .iphone-float-wrap{
    position:relative;
    right:auto;
    bottom:auto;
    margin:40px auto;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div>
    <h1 class="reveal">
      Descubra quanto você pode gastar hoje<br>
      <span style="color:#38C172">sem comprometer seus objetivos</span>
    </h1>

    <p class="reveal">
      Veja exatamente para onde seu dinheiro está indo em tempo real.
    </p>

    <div class="cta reveal">
      <button class="primary">Começar agora</button>
      <button class="secondary">Ver demo</button>
    </div>

    <!-- MOCKUP -->
    <div class="mockup-wrap reveal">

      <div class="glow"></div>

      <div class="mockup-real" id="mockup">
        <img src="mockup.png" alt="App Grana+" />
      </div>

      <!-- IPHONE -->
      <div class="iphone-float-wrap">
        <div class="iphone" id="iphone">
          <img src="iphone.png" alt="App mobile" />
        </div>
      </div>

    </div>

  </div>

</section>

<section class="section">
  <h2 class="reveal">Sem controle, você paga caro.</h2>
  <div class="cards">
    <div class="card reveal">Faturas esquecidas</div>
    <div class="card reveal">Gastos invisíveis</div>
    <div class="card reveal">Ansiedade financeira</div>
    <div class="card reveal">Sem planejamento</div>
  </div>
</section>

<script>
// REVEAL
const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible')
    }
  })
})
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el))

// TILT MOCKUP
const mockup = document.getElementById("mockup")
const iphone = document.getElementById("iphone")
const glow = document.querySelector(".glow")

document.addEventListener("mousemove",(e)=>{
  let x = (window.innerWidth/2 - e.clientX)/40
  let y = (window.innerHeight/2 - e.clientY)/40

  mockup.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`
  iphone.style.transform = `rotateY(${x*1.5}deg) rotateX(${-y*1.5}deg) scale(1.05)`

  glow.style.left = e.clientX - 150 + "px"
  glow.style.top = e.clientY - 150 + "px"
})
</script>

</body>
</html>
